id = "cph"
name = "Competitive Programming Helper"
version = "0.1.0"
schema_version = 1
authors = ["wanony"]
description = "Receives problems from competitive-companion browser extension and creates solution templates with test cases"
repository = "https://github.com/ashusevim/cph-zed"

[slash_commands.cph-fetch]
description = "Fetch a competitive programming problem from competitive-companion JSON"
requires_argument = true

[slash_commands.cph-run]
description = "Print the command to run one test case (or all of them)"
requires_argument = false

[slash_commands.cph-test]
description = "Print the command to test the solution against all cases"
requires_argument = false

[slash_commands.cph-server]
description = "Instructions for the companion server, which fetches problems automatically"
requires_argument = false
